name: baby_monitor
description: Baby monitor nativo per camere ONVIF/RTSP (Fredi/Yoosee) - senza cervello.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # Decoder video/audio integrato (media_kit = libmpv/ffmpeg): riproduce RTSP
  # direttamente, come faceva ffmpeg su Termux, ma dentro il telefono.
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  # ONVIF (PTZ) e snapshot via HTTP + digest auth
  http: ^1.2.0
  crypto: ^3.0.3
  xml: ^6.5.0
  # Rilevamento movimento: confronto tra fotogrammi (snapshot del video)
  image: ^4.1.7
  # Riproduzione ninna nanne sul dispositivo
  audioplayers: ^6.0.0
  # Salvataggio configurazione + feedback
  shared_preferences: ^2.2.3
  wakelock_plus: ^1.2.5
  vibration: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/beep.wav
    - assets/lullabies/
