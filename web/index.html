<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1420">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Baby Monitor">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
  <title>Baby Monitor</title>
</head>
<body>
  <header class="topbar">
    <div class="brand">👶 Baby Monitor</div>
    <div class="topbar-right">
      <div id="status-pill" class="pill pill--off">Connessione…</div>
      <button id="settings-btn" class="icon-btn" title="Configura camera" aria-label="Configura">⚙️</button>
    </div>
  </header>

  <div id="offline-banner" class="offline-banner hidden">
    ⚠️ Collegamento perso — sei fuori dal raggio WiFi o il cervello è spento
  </div>

  <main>
    <section class="video-card">
      <img id="video" alt="Video della camera" />
      <div id="motion-badge" class="motion-badge hidden">● Movimento</div>
    </section>

    <section class="controls">
      <div class="row">
        <label class="switch">
          <input type="checkbox" id="motion-toggle" checked>
          <span class="slider"></span>
        </label>
        <div class="row-label">
          <strong>Rilevamento movimento</strong>
          <small id="motion-count">0 rilevamenti</small>
        </div>
      </div>

      <div class="row column">
        <div class="row-label"><strong>Sensibilità</strong> <small id="sens-value">55</small></div>
        <input type="range" id="sensitivity" min="1" max="100" value="55">
        <div class="range-hints"><span>Meno falsi allarmi</span><span>Più sensibile</span></div>
      </div>
    </section>

    <section class="lullabies">
      <h2>🎵 Ninna nanne</h2>
      <p class="hint">Suonano da <em>questo</em> dispositivo: tienilo vicino alla culla.</p>
      <div id="lullaby-list" class="lullaby-list"></div>
      <label class="btn btn--add" for="lullaby-upload">➕ Aggiungi ninna nanna</label>
      <input type="file" id="lullaby-upload" accept="audio/*" multiple hidden>
      <audio id="player" preload="none"></audio>
      <div id="now-playing" class="now-playing hidden">
        <span id="np-title"></span>
        <label class="loop"><input type="checkbox" id="loop-toggle" checked> ripeti</label>
        <button id="stop-btn" class="btn btn--stop">Stop</button>
      </div>
    </section>
  </main>

  <!-- Popup di allarme movimento -->
  <div id="alert" class="alert-overlay hidden" role="alertdialog" aria-live="assertive">
    <div class="alert-box">
      <div class="alert-emoji">👶</div>
      <div class="alert-title">Il bimbo si è mosso!</div>
      <div id="alert-time" class="alert-time"></div>
      <button id="alert-dismiss" class="btn btn--primary">Ho capito</button>
    </div>
  </div>

  <!-- Wizard di prima configurazione (mostrato solo se non configurato) -->
  <div id="wizard" class="wizard-overlay hidden"></div>

  <script src="wizard.js"></script>
  <script src="app.js"></script>
</body>
</html>
